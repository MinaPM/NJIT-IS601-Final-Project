<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Profile</title>
</head>

<body>
    <h1>User Information</h1>
    <pre id="user-info">Loading...</pre>
    <p>Username: <span id="username"></span></p>
    <p>Email: <span id="email"></span></p>
    <p>Name: <span id="first-name"></span> <span id="last-name"></span></p>


    <script>
        async function loadUserProfile() {
            const token = localStorage.getItem("access_token");

            if (!token) {
                window.location.href = "/login";
            }

            const res = await fetch("/auth/me", {
                headers: { "Authorization": `Bearer ${token}` }
            });

            if (!res.ok) {
                window.location.href = "/login";
            }

            const user = await res.json();
            // populate your fields

            document.getElementById("username").textContent = user.username;
            document.getElementById("email").textContent = user.email;
            document.getElementById("first-name").textContent = user.first_name;
            document.getElementById("last-name").textContent = user.last_name;
            // document.getElementById("verified").textContent = user.is_verified ? "Yes" : "No";
        }

        loadUserProfile();
    </script>
</body>

</html>
